name: Labeling website checks
on:
  push:
    branches: [RADU/labeling]
    paths: ['labeling/**', '.github/workflows/labeling-app.yml']
  pull_request:
    branches: [RADU/labeling]
    paths: ['labeling/**', '.github/workflows/labeling-app.yml']
permissions:
  contents: read
jobs:
  app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: labeling
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - run: npm run build
      - name: Package standalone server handoff
        run: python tools/package_selfhost.py
      - uses: actions/upload-artifact@v4
        with:
          name: hybridocr-labeling-selfhost
          path: |
            artifacts/hybridocr-labeling-selfhost.tar.gz
            artifacts/hybridocr-labeling-selfhost.tar.gz.sha256
          retention-days: 14
          compression-level: 0
