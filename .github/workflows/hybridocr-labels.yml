name: HybridOCR label validation
on:
  pull_request:
    branches: [feat/hybridocr]
    paths:
      - 'data/benchmark/qwen_ablation_pilot/labels/**'
      - 'data/benchmark/qwen_ablation_pilot/additional_images.manifest.json'
      - 'src/evaluation/annotation_files.py'
      - '.github/workflows/hybridocr-labels.yml'
  push:
    branches: [feat/hybridocr]
    paths:
      - 'data/benchmark/qwen_ablation_pilot/labels/**'
      - 'data/benchmark/qwen_ablation_pilot/additional_images.manifest.json'
      - 'src/evaluation/annotation_files.py'
      - '.github/workflows/hybridocr-labels.yml'
permissions:
  contents: read
jobs:
  labels:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Validate all 122 per-image labels (no GPU or dependencies)
        run: >-
          python -m src.evaluation.annotation_files check
          --directory data/benchmark/qwen_ablation_pilot/labels
          --manifest data/benchmark/qwen_ablation_pilot/additional_images.manifest.json
