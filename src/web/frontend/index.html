<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>RADU · 손그림 순서도 복원</title>
  <style>
    :root{font-family:Inter,"Noto Sans KR",system-ui,sans-serif;color:#172033;background:#f4f7fb}*{box-sizing:border-box}body{margin:0}header{background:#10233f;color:white;padding:18px 24px;display:flex;align-items:center;justify-content:space-between}header strong{font-size:20px;letter-spacing:.04em}header span{color:#b8c8df;font-size:13px}.layout{display:grid;grid-template-columns:300px 1fr;gap:18px;padding:18px;max-width:1600px;margin:auto}.panel,.workspace{background:white;border:1px solid #e0e7f0;border-radius:12px;box-shadow:0 3px 12px #22334a0a}.panel{padding:18px;height:max-content}.panel h2{font-size:15px;margin:0 0 12px}.panel p,.hint{font-size:12px;line-height:1.6;color:#63728a}.field{display:grid;gap:7px;margin-bottom:14px}label{font-size:12px;font-weight:650;color:#42516a}input[type=file],select{width:100%;font:inherit;font-size:13px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;padding:12px;border-bottom:1px solid #e8edf4}.btn{border:1px solid #d6dfeb;background:white;color:#26364f;padding:8px 11px;border-radius:8px;cursor:pointer;font-weight:600;font-size:12px}.btn.primary{background:#2563eb;color:white;border-color:#2563eb}.btn:hover{filter:brightness(.96)}.workspace{overflow:hidden}.canvas-wrap{overflow:auto;background:#e9eef5;padding:18px;min-height:560px}.canvas{position:relative;margin:auto;background:#fff;box-shadow:0 2px 10px #18294122;overflow:hidden}.canvas svg{position:absolute;inset:0;width:100%;height:100%;touch-action:none}.node{cursor:move}.node rect{fill:#fff;stroke:#2563eb;stroke-width:2}.node text{font:14px system-ui;fill:#172033;pointer-events:none}.node.selected rect{stroke:#e11d48;stroke-width:3}.node text.editable{pointer-events:all;cursor:text}.edge{stroke:#45556d;stroke-width:2;fill:none;marker-end:url(#arrow)}.edge.review{stroke:#d97706;stroke-dasharray:5 4}.status{padding:10px 14px;font-size:12px;color:#52627a;border-top:1px solid #e8edf4}.warnings{max-height:180px;overflow:auto;padding-left:18px;color:#9a5b00;font-size:12px}.small{font-size:11px;color:#8290a4}.row{display:flex;gap:8px}.row>*{flex:1}@media(max-width:850px){.layout{grid-template-columns:1fr}.panel{order:1}.workspace{order:0}}
  </style>
</head>
<body>
<header><strong>RADU</strong><span>Relation Aware Document Understanding</span></header>
<main class="layout">
  <aside class="panel">
    <h2>문서 입력</h2>
    <div class="field"><label for="image">손그림 순서도 이미지</label><input id="image" type="file" accept="image/*"></div>
    <div class="field"><label for="ocr">OCR 엔진</label><select id="ocr"><option value="none">OCR 사용 안 함</option><option value="paddleocrv6">PaddleOCR v6 (로컬)</option><option value="paddleocrvl16">PaddleOCR-VL 1.6 (로컬 전체 파이프라인)</option><option value="clova" disabled>CLOVA OCR (보류 · 기본 실행 안 함)</option></select></div>
    <button class="btn primary" id="analyze">분석 시작</button>
    <hr style="border:0;border-top:1px solid #e7ecf3;margin:18px 0">
    <h2>선택 요소</h2><p id="selection">요소를 선택하면 텍스트 수정, 삭제, 연결을 할 수 있습니다.</p>
    <div class="row"><button class="btn" id="edit">텍스트 수정</button><button class="btn" id="remove">삭제</button></div>
    <p class="hint">연결 만들기: 도형 하나를 선택한 뒤 ‘연결 시작’, 다음 도형을 선택하세요. 이동은 요소를 드래그합니다.</p>
    <div class="row"><button class="btn" id="connect">연결 시작</button><button class="btn" id="add">도형 추가</button></div>
    <hr style="border:0;border-top:1px solid #e7ecf3;margin:18px 0">
    <h2>확인 필요 항목</h2><ul class="warnings" id="warnings"><li>이미지를 분석하면 검수 항목이 표시됩니다.</li></ul>
    <div class="field" style="margin-top:14px"><label>결과 내보내기</label><div class="row"><button class="btn export" data-fmt="json">JSON</button><button class="btn export" data-fmt="svg">SVG</button></div><div class="row"><button class="btn export" data-fmt="png">PNG</button><button class="btn export" data-fmt="pdf">PDF</button></div></div>
    <button class="btn" id="save">편집본 저장</button>
  </aside>
  <section class="workspace"><div class="toolbar"><span class="small" id="filename">분석된 문서가 여기에 표시됩니다.</span></div><div class="canvas-wrap"><div class="canvas" id="canvas"><svg id="svg" xmlns="http://www.w3.org/2000/svg"></svg></div></div><div class="status" id="status">이미지를 업로드해 분석을 시작하세요.</div></section>
</main>
<script>
const $=s=>document.querySelector(s);let doc=null,selected=null,connectFrom=null,scale=1,drag=null;
function msg(text){$('#status').textContent=text}
$('#analyze').onclick=async()=>{const f=$('#image').files[0];if(!f){msg('먼저 이미지 파일을 선택하세요.');return}msg('이미지 분석 중…');const fd=new FormData();fd.append('file',f);const o=$('#ocr').value;try{const r=await fetch(`/api/analyze?ocr_engine=${encodeURIComponent(o)}`,{method:'POST',body:fd});if(!r.ok)throw new Error(await r.text());doc=await r.json();$('#filename').textContent=f.name;render();msg(`분석 완료 · 요소 ${doc.elements.length}개 · 관계 ${doc.relations.length}개`)}catch(e){msg('분석 실패: '+e.message)}};
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function render(){if(!doc)return;const c=$('#canvas'),svg=$('#svg'),w=doc.image?.width||900,h=doc.image?.height||650;c.style.width=w+'px';c.style.height=h+'px';svg.setAttribute('viewBox',`0 0 ${w} ${h}`);let s='<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="#45556d"/></marker></defs>';
for(const r of doc.relations||[]){if(r.type!=='flows_to')continue;const a=doc.elements.find(e=>e.id===r.source),b=doc.elements.find(e=>e.id===r.target);if(!a||!b)continue;const acx=(a.bbox[0]+a.bbox[2])/2,acy=(a.bbox[1]+a.bbox[3])/2,bcx=(b.bbox[0]+b.bbox[2])/2,bcy=(b.bbox[1]+b.bbox[3])/2;s+=`<path class="edge ${r.status==='review'?'review':''}" d="M${acx} ${acy} L${bcx} ${bcy}"/>`}
for(const e of doc.elements){const [x,y,x2,y2]=e.bbox,ww=Math.max(12,x2-x),hh=Math.max(12,y2-y),active=e.id===selected?'selected':'';if(e.type==='Arrow'){s+=`<g class="node ${active}" data-id="${esc(e.id)}"><rect x="${x}" y="${y}" width="${ww}" height="${hh}" fill="transparent" stroke="#16a34a" stroke-dasharray="4 3"/><text x="${x+3}" y="${y+14}" fill="#15803d">화살표</text></g>`;continue}let label=e.type==='Text'?(e.text||'텍스트'):((e.shape==='decision'?'판단':e.shape==='terminator'?'시작/종료':'도형'));s+=`<g class="node ${active}" data-id="${esc(e.id)}"><rect x="${x}" y="${y}" width="${ww}" height="${hh}" rx="7"/><text x="${x+ww/2}" y="${y+hh/2+5}" text-anchor="middle">${esc(label)}</text></g>`}
svg.innerHTML=s;svg.querySelectorAll('.node').forEach(n=>{n.onpointerdown=startDrag;n.onclick=event=>{event.stopPropagation();select(n.dataset.id)}});const list=$('#warnings');list.innerHTML=(doc.warnings||[]).map(w=>`<li>${esc(w.message||w.code)}</li>`).join('')||'<li>현재 확인 필요 항목이 없습니다.</li>';updateSelection()}
function select(id){selected=id;if(connectFrom&&id!==connectFrom){const a=doc.elements.find(e=>e.id===connectFrom),b=doc.elements.find(e=>e.id===id);if(a?.type==='Box'&&b?.type==='Box'){doc.relations.push({id:'manual-'+crypto.randomUUID().slice(0,8),type:'flows_to',source:a.id,target:b.id,direction:'unknown',status:'review'});doc.elements.push({id:'manual-arrow-'+crypto.randomUUID().slice(0,6),type:'Arrow',bbox:[(a.bbox[2]+b.bbox[0])/2,(a.bbox[3]+b.bbox[1])/2,(a.bbox[2]+b.bbox[0])/2+1,(a.bbox[3]+b.bbox[1])/2+1],source:'manual'});connectFrom=null;msg('연결을 추가했습니다. 원본과 연결 방향을 확인하세요.')}else msg('연결은 도형(Box)끼리 만들 수 있습니다.')}render()}
function updateSelection(){const e=doc?.elements.find(x=>x.id===selected);$('#selection').textContent=e?`${e.id} · ${e.type}${e.text?' · '+e.text:''}`:'요소를 선택하면 텍스트 수정, 삭제, 연결을 할 수 있습니다.'}
$('#edit').onclick=()=>{const e=doc?.elements.find(x=>x.id===selected);if(!e)return;if(e.type!=='Text'){msg('텍스트 수정은 Text 요소에 사용할 수 있습니다.');return}const v=prompt('텍스트 내용',e.text||'');if(v!==null){e.text=v;render()}};
$('#remove').onclick=()=>{if(!doc||!selected)return;doc.elements=doc.elements.filter(e=>e.id!==selected);doc.relations=doc.relations.filter(r=>r.source!==selected&&r.target!==selected&&r.arrow_id!==selected);selected=null;render();msg('요소를 삭제했습니다.')};
$('#connect').onclick=()=>{if(!selected){msg('먼저 시작 도형을 선택하세요.');return}connectFrom=selected;msg('이제 연결할 대상 도형을 선택하세요.')};
$('#add').onclick=()=>{if(!doc)return;const id='manual-box-'+crypto.randomUUID().slice(0,6),x=doc.image.width/2-65,y=doc.image.height/2-30;doc.elements.push({id,type:'Box',shape:'process',bbox:[x,y,x+130,y+60],confidence:1,source:'manual'});selected=id;render();msg('도형을 추가했습니다. 드래그해 배치하세요.')};
function startDrag(ev){const id=ev.currentTarget.dataset.id;select(id);const e=doc.elements.find(x=>x.id===id);drag={id,x:ev.clientX,y:ev.clientY,box:[...e.bbox]};ev.currentTarget.setPointerCapture?.(ev.pointerId);ev.preventDefault()}
window.onpointermove=ev=>{if(!drag)return;const e=doc.elements.find(x=>x.id===drag.id);const rect=$('#svg').getBoundingClientRect();const dx=(ev.clientX-drag.x)*(doc.image.width/rect.width),dy=(ev.clientY-drag.y)*(doc.image.height/rect.height);e.bbox=[drag.box[0]+dx,drag.box[1]+dy,drag.box[2]+dx,drag.box[3]+dy];render()};window.onpointerup=()=>{drag=null};
async function download(fmt){if(!doc)return msg('먼저 이미지를 분석하세요.');try{const r=await fetch('/api/export/'+fmt,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(doc)});if(!r.ok)throw new Error(await r.text());const blob=await r.blob(),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='radu-flowchart.'+fmt;a.click();URL.revokeObjectURL(a.href);msg(fmt.toUpperCase()+' 파일을 내보냈습니다.')}catch(e){msg('내보내기 실패: '+e.message)}}
document.querySelectorAll('.export').forEach(b=>b.onclick=()=>download(b.dataset.fmt));$('#save').onclick=async()=>{if(!doc)return;const r=await fetch('/api/save',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(doc)});const x=await r.json();msg(x.saved?'편집본을 서버에 저장했습니다.':'저장에 실패했습니다.')};
</script>
</body></html>
